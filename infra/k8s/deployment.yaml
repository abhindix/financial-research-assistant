apiVersion: apps/v1
kind: Deployment
metadata: {name: financial-research-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: financial-research-api}}
  template:
    metadata: {labels: {app: financial-research-api}}
    spec:
      containers:
      - name: api
        image: ghcr.io/YOUR_ORG/financial-research-assistant:latest
        ports: [{containerPort: 8000}]
        envFrom: [{secretRef: {name: financial-research-secrets}}]
        readinessProbe: {httpGet: {path: /api/v1/health, port: 8000}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: financial-research-api}
spec:
  selector: {app: financial-research-api}
  ports: [{port: 80,targetPort: 8000}]
